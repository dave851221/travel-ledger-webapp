name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# 建置與部署拆成兩個 job（GitHub 官方範本的做法）：同一個 job 裡上傳完 artifact 立刻部署，
# deploy-pages 常常在 artifact 還沒登記好就去查，報「No artifacts named github-pages」而失敗。
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Edge Function 是 Deno 程式碼，tsc 看不到它。
      # 這個專案踩過「部署後靜默失效」的坑，型別檢查是最基本的一道防線。
      - name: Type-check Edge Functions
        run: npm run check:functions

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # 舊版首頁的「前往旅行小本本」連到新網站
          VITE_SITE_URL: https://meowtrip.pages.dev/

      # 開放版（旅行小本本）2026-11-28 搬到 Cloudflare Pages（https://meowtrip.pages.dev/，main 自動部署）。
      # 舊網址 /next/ 只放轉址頁（帶著 ?query 與 #hash 轉過去）和一個會自己註銷的 Service Worker。
      - name: Redirect /next/ to the new site
        run: mkdir -p dist/next && cp next-redirect/index.html next-redirect/sw.js dist/next/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
