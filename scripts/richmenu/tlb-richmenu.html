<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<!-- 旅行喵喵的圖文選單（2500×843）。scripts/tlb-richmenu.mjs 用 Chrome 截圖成 PNG 再上傳到 LINE。
     格子順序要跟 tlb-richmenu.mjs 的 AREAS 一樣（左上→右上，再左下→右下）。 -->
<style>
  html, body { margin: 0; width: 2500px; height: 843px; overflow: hidden; }
  body { font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; background: #FFF6EA; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); width: 100%; height: 100%; }
  .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
          border-right: 6px solid #F3DDBF; border-bottom: 6px solid #F3DDBF; box-sizing: border-box; }
  .cell:nth-child(3n) { border-right: none; }
  .cell:nth-child(n+4) { border-bottom: none; }
  .icon { width: 190px; height: 190px; border-radius: 56px; display: flex; align-items: center; justify-content: center; font-size: 120px; }
  .label { font-size: 82px; font-weight: 800; color: #4A3728; letter-spacing: 4px; }
  .a { background: #FFE2B8; } .b { background: #D9F0E3; } .c { background: #E3E6FB; }
  .d { background: #FFD9D2; } .e { background: #DDEEFF; } .f { background: #F1E4D3; }
  .primary { background: #FFB547; }
  .primary .label { color: #fff; }
  .primary .icon { background: rgba(255,255,255,.35); }
</style></head>
<body><div class="grid">
  <div class="cell"><div class="icon a">📅</div><div class="label">今日支出</div></div>
  <div class="cell"><div class="icon b">🗺️</div><div class="label">旅程總覽</div></div>
  <div class="cell"><div class="icon c">✏️</div><div class="label">編輯支出</div></div>
  <div class="cell primary"><div class="icon">🐱</div><div class="label">綁定旅程</div></div>
  <div class="cell"><div class="icon e">🌐</div><div class="label">打開網頁</div></div>
  <div class="cell"><div class="icon f">❓</div><div class="label">使用說明</div></div>
</div></body></html>
